name: Build & Release (3 OS)

on:
  push:
    tags:
      - "20*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            build_script: bash build.sh
            artifact: YTDown-macOS.dmg

          - os: windows-latest
            platform: windows
            build_script: bash build-windows.sh
            artifact: YTDown-Windows-Setup.exe

          - os: ubuntu-22.04
            platform: linux
            build_script: bash build-linux.sh
            artifact: YTDown-Linux.AppImage

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev wget

      - name: macOS deps
        if: matrix.platform == 'darwin'
        run: brew install create-dmg

      - name: Install NSIS (Windows)
        if: matrix.platform == 'windows'
        uses: juancarlospaco/nsis-action@main

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - run: go mod download

      - name: Build
        run: ${{ matrix.build_script }}
        env:
          VERSION: ${{ github.ref_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}