name: Build & Release (Multi-Platform)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "20*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate version
        id: calc
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tag push thủ công: dùng tag làm version luôn
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            # Push lên main: tự tính version mới
            bash get-version.sh
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            build_script: bash build.sh
            artifact_pattern: dist/*.dmg
            artifact_name: ytdown-darwin
            name: macOS

          - os: windows-latest
            platform: windows
            build_script: bash build-windows.sh
            artifact_pattern: dist/*
            artifact_name: ytdown-windows
            name: Windows

            # Linux amd64
          - os: ubuntu-22.04
            platform: linux
            build_script: bash build-linux.sh
            artifact_pattern: dist/*.deb
            artifact_name: ytdown-linux-amd64
            name: Linux (amd64)

            # Linux arm64
          - os: ubuntu-22.04-arm
            platform: linux
            build_script: bash build-linux.sh
            artifact_pattern: dist/*.deb
            artifact_name: ytdown-linux-arm64
            name: Linux (arm64)

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Linux deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            build-essential \
            pkg-config \
            dpkg-dev

      # ✅ FIX 1 & 2: Gộp 2 step Windows lại thành 1, sửa điều kiện macOS
      # (macOS không cần deps thêm ngoài Xcode CLI đã có sẵn trên runner)
      - name: Windows deps
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - run: go mod download

      - name: Build
        id: build
        run: ${{ matrix.build_script }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_pattern }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    # ✅ Expose version ra ngoài để update-homebrew dùng
    outputs:
      version: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          find artifacts -type f -exec cp {} dist/ \;

      # ✅ FIX 4: Bỏ duplicate key 'files:', dùng dist/* cho chắc chắn
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          name: "YTDown ${{ needs.version.outputs.version }}"
          generate_release_notes: true
          make_latest: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-homebrew:
    needs: release
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ytdown-darwin
          path: dist

      - name: Update Homebrew Tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          DMG_FILE=$(ls dist/*.dmg | head -n 1)
          SHA256=$(shasum -a 256 "$DMG_FILE" | awk '{print $1}')
          # ✅ Lấy version từ output của job release thay vì github.ref_name
          VERSION=${{ needs.release.outputs.version }}

          git clone https://x-access-token:${GH_TOKEN}@github.com/JustinNguyen9979/homebrew-ytdown.git
          cd homebrew-ytdown

          sed -i '' "s/version \".*\"/version \"$VERSION\"/" Casks/ytdown.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"$SHA256\"/" Casks/ytdown.rb

          git config user.email "actions@github.com"
          git config user.name "GitHub Action"
          git add Casks/ytdown.rb
          git commit -m "Update ytdown to $VERSION"
          git push

  publish-apt-repo:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'

    steps:
      - name: Install apt repo tools
        run: sudo apt-get install -y dpkg-dev apt-utils

      - name: Download Linux amd64
        uses: actions/download-artifact@v4
        with:
          name: ytdown-linux-amd64
          path: debs/

      - name: Download Linux arm64
        uses: actions/download-artifact@v4
        with:
          name: ytdown-linux-arm64
          path: debs/

      - name: Build APT repository
        run: |
          mkdir -p apt-repo/pool/main
          mkdir -p apt-repo/dists/stable/main/binary-amd64
          mkdir -p apt-repo/dists/stable/main/binary-arm64
          cp debs/*.deb apt-repo/pool/main/

          cd apt-repo
          dpkg-scanpackages --arch amd64 pool/main > dists/stable/main/binary-amd64/Packages
          gzip -k dists/stable/main/binary-amd64/Packages
          dpkg-scanpackages --arch arm64 pool/main > dists/stable/main/binary-arm64/Packages
          gzip -k dists/stable/main/binary-arm64/Packages

              tee /tmp/apt-ftparchive.conf > /dev/null << 'CONF'
                APT::FTPArchive::Release {
                  Origin "YTDown";
                  Label "YTDown";
                  Suite "stable";
                  Codename "stable";
                  Architectures "amd64 arm64";
                  Components "main";
                  Description "YTDown APT Repository";
                };
              CONF

          # ✅ Chỉ dùng apt-ftparchive, KHÔNG dùng cat > để ghi đè
              apt-ftparchive -c /tmp/apt-ftparchive.conf release dists/stable > dists/stable/Release

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apt-repo
          destination_dir: apt
          keep_files: false

  update-winget-manifests:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    outputs:
      version: ${{ needs.release.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: ytdown-windows
        path: dist

    - name: Update Winget Manifests
      run: |
        VERSION=${{ needs.release.outputs.version }}
        EXE_FILE=$(ls dist/*.exe | head -n 1)
        SHA256=$(sha256sum "$EXE_FILE" | awk '{print $1}')
        EXE_NAME=$(basename "$EXE_FILE")
        INSTALLER_URL="https://github.com/JustinNguyen9979/YTDown/releases/download/$VERSION/$EXE_NAME"

        echo "Updating Winget manifests to version $VERSION with SHA256 $SHA256"

        # Update Version in all 3 files
        sed -i "s/PackageVersion: .*/PackageVersion: $VERSION/" winget/*.yaml

        # Update Installer specific fields
        sed -i "s|InstallerUrl: .*|InstallerUrl: $INSTALLER_URL|" winget/JustinNguyen.YTDown.installer.yaml
        sed -i "s/InstallerSha256: .*/InstallerSha256: $SHA256/" winget/JustinNguyen.YTDown.installer.yaml
        sed -i "s/DisplayVersion: .*/DisplayVersion: $VERSION/" winget/JustinNguyen.YTDown.installer.yaml

        git config user.email "actions@github.com"
        git config user.name "GitHub Action"
        git add winget/*.yaml
        git commit -m "Update winget manifests to $VERSION" || echo "No changes to commit"
        git push

  submit-to-winget:
    needs: [release, update-winget-manifests]
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    steps:
      - name: Sync fork winget-pkgs với microsoft/winget-pkgs 
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          gh repo sync JustinNguyen9979/winget-pkgs --source microsoft/winget-pkgs --force
        shell: pwsh

      - name: Submit manifest to winget
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

          $version = "${{ needs.release.outputs.version }}"
          $url = "https://github.com/JustinNguyen9979/YTDown/releases/download/$version/YTDown-$version-Windows-Setup.exe"

          .\wingetcreate.exe update JustinNguyen.YTDown `
            --version $version `
            --display-version $version `
            --urls "$url|x64" `
            --out manifests

          $f = Get-ChildItem -Path manifests -Recurse -Filter "*.installer.yaml" | Select-Object -First 1
          $content = Get-Content $f.FullName -Raw
          if (-not $content.Contains("Dependencies:")) {
              $deps = "`nDependencies:`n  PackageDependencies:`n    - PackageIdentifier: Gyan.FFmpeg`n    - PackageIdentifier: yt-dlp.yt-dlp`n    - PackageIdentifier: mikf.gallery-dl"
              Add-Content -Path $f.FullName -Value $deps
              Write-Host "✅ Injected Dependencies into $($f.Name)"
          }

          .\wingetcreate.exe submit --token $env:WINGET_TOKEN manifests



